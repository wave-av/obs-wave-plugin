name: clang-format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 --version

      - name: Check formatting
        run: |
          echo "Checking:"
          git ls-files "*.c" "*.h"
          git ls-files -z "*.c" "*.h" | xargs -0 -r clang-format-18 --dry-run --Werror --
